<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="30">   
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: #202124;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .status-dot {
            height: 12px;
            width: 12px;
            border-radius: 50%;
        }
        .card{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #36383d;
            border: 1px solid transparent; 
            padding: 24px;
            margin: 1rem;
            color: whitesmoke;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 2px 5px -1px, rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
        }
        .status-dot{
            margin-right: 5px;
        }
        #cards{
            display: grid;
            grid-template-columns: 33% 33%;
            width: 100%;
            justify-content: center;
            flex-direction: row;
        }
    </style>
    <title>Pi Monitor</title>
</head>
<body>
    <div id="cards">
	{% for x, host in hosts.items() %}    
        <div class="card">
	    {% if host["status"] == "up" %}
              <div class="status-dot" style="background-color: green"></div>
	    {% else %}
              <div class="status-dot" style="background-color: red"></div>
	    {% endif %}
	    <p>{{ host["name"] }}</p>
        </div>
	{% endfor %}
    </div>
</body>
</html>
